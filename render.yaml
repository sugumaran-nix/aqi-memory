services:
  - type: web
    name: aqi-memory-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: aqi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: LOG_LEVEL
        value: INFO
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: "https://aqi-memory.vercel.app"
